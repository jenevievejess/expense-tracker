{% extends "base.html" %}
{% block title %}{{ "Edit" if entry else "Add" }} Transfer{% endblock %}
{% block content %}

    <div class="card" style="max-width: 480px; margin: 0 auto;">
        <h2>{{ "Edit" if entry else "Add" }} Transfer</h2>

        <form method="post" action="{{ url_for('transfer_edit', transfer_id=entry[0]) if entry else url_for('transfer_add') }}">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" name="date" id="date" value="{{ entry[1] if entry else default_date }}" required>
            </div>

            <div class="form-group">
                <label for="from_method">From</label>
                <select name="from_method" id="from_method" required>
                    {% for id, name, color in methods %}
                        <option value="{{ name }}" {{ "selected" if entry and entry[2] == name else "" }}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="to_method">To</label>
                <select name="to_method" id="to_method" required>
                    {% for id, name, color in methods %}
                        <option value="{{ name }}" {{ "selected" if entry and entry[3] == name else "" }}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" step="0.01" name="amount" id="amount" value="{{ entry[4] if entry else '' }}" required>
            </div>

            <div class="form-group">
                <label for="note">Note</label>
                <input type="text" name="note" id="note" value="{{ entry[5] if entry else '' }}" placeholder="e.g. ATM withdrawal">
            </div>

            <div class="form-actions">
                <div class="form-actions-left">
                    <a href="{{ url_for('accounts_view') }}" class="btn-cancel">Cancel</a>
                    {% if entry %}
                        <button type="submit" formaction="{{ url_for('transfer_delete', transfer_id=entry[0]) }}" class="btn btn-danger" onclick="return confirm('Delete this transfer?');">Delete</button>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary">{{ "Save changes" if entry else "Add Transfer" }}</button>
            </div>
        </form>
    </div>

{% endblock %}
