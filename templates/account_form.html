{% extends "base.html" %}
{% block title %}Set Balance - {{ method_name }}{% endblock %}
{% block content %}

    <div class="card b-full-green" style="max-width: 420px; margin: 0 auto;">
        <h2>{{ method_name }}</h2>

        <form method="post" action="{{ url_for('accounts_set', method_name=method_name) }}">
            <div class="form-group">
                <label for="start_date">Balance as of</label>
                <input type="date" name="start_date" id="start_date" value="{{ account.start_date if account else default_date }}" required>
            </div>

            <div class="form-group">
                <label for="starting_balance">Balance amount</label>
                <input type="number" step="0.01" name="starting_balance" id="starting_balance" value="{{ account.starting_balance if account else '' }}" required>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('accounts_view') }}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>

{% endblock %}
