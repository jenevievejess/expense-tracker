{% extends "base.html" %}
{% block title %}Add Category{% endblock %}
{% block content %}

    <div class="card" style="max-width: 480px; margin: 0 auto;">
        <h2>Add Category</h2>

        <form method="post" action="{{ url_for('labels_add_category') }}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="e.g. groceries, rent, hobbies" required>
            </div>

            <div class="form-group">
                <label>Color</label>
                <div class="color-picker">
                    {% for c in category_colors %}
                        <label class="color-swatch" style="background-color: {{ c }};">
                            <input type="radio" name="color" value="{{ c }}" {{ "checked" if loop.first else "" }}>
                        </label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('settings_view') }}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-primary">Add Category</button>
            </div>
        </form>
    </div>

{% endblock %}
